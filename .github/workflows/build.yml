# builds the mod jar (including the osu!lazer dll) from source, so the jar that
# goes on modrinth can be checked against this repo.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
      - run: ./gradlew build

      - run: sha256sum build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: 20tps
          path: build/libs/*.jar

